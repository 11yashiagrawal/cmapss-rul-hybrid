# #66: one factor at a time, around the tuned #58 LSTM.
# Run notebooks/phase2/10_regularization.ipynb from a fresh kernel.
base: lstm.yaml
name: regularization

training:
  input_noise_std: 0.0

study:
  # Keep the inherited cap=125 and selection threshold=130 provisional until #55.
  # Every setting runs with both capped and uncapped targets, on the same folds.
  variations:
    model.dropout: [0.1, 0.5]           # baseline: 0.3 (final hidden state)
    training.weight_decay: [0.0001, 0.001]  # baseline: 0 (Adam L2)
    training.input_noise_std: [0.01, 0.05]  # baseline: 0 (scaled sensor units)
    inputs.stride: [2, 5]             # baseline: 1; validation always stride 1
    training.patience: [5, 20]        # baseline: 10; maximum epochs stays 100
