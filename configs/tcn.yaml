# Temporal CNN (#59): dilated causal convolutions in residual blocks.
# Settings come from the grid in notebooks/phase2/07_tcn.ipynb (cross-validation only).
# Run: python scripts/train_dl.py --config configs/tcn.yaml
base: dl_base.yaml
name: tcn

model:
  type: tcn
  channels: 32
  kernel_size: 3
  levels: 4          # receptive field 61 cycles, which covers the 30-cycle window
  dropout: 0.1
